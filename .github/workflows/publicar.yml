name: Publicar atualizacao da Camera
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Validar APK assinado e atualizar canal
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_JSON: ${{ toJSON(github.event.release) }}
        run: python3 publicar.py
      - name: Publicar manifesto
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add update.json
          git diff --cached --quiet || git commit -m "Atualizar canal da Camera"
          git push origin HEAD:main
